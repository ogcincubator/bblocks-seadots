$schema: https://json-schema.org/draft/2020-12/schema
title: POSEIDON Port and Market Input
description: Port, landing, market, and fuel-price input consumed by POSEIDON.
type: object
properties:
  portInitializerType:
    type: string
    examples: ["One Port", "Two Ports", "List of Ports", "Random Ports"]
  ports:
    type: array
    items:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        x:
          type: number
        y:
          type: number
        longitude:
          type: number
        latitude:
          type: number
        usingGridCoordinates:
          type: boolean
      additionalProperties: true
  market:
    type: object
    properties:
      type:
        type: string
      priceBySpecies:
        type: object
        additionalProperties:
          type: number
      priceFile:
        type: string
    additionalProperties: true
  fuel:
    type: object
    properties:
      gasPriceMaker:
        type: string
      fuelPrice:
        type: number
      fuelPriceFile:
        type: string
    additionalProperties: true
additionalProperties: true
