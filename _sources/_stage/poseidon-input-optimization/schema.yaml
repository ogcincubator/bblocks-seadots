$schema: https://json-schema.org/draft/2020-12/schema
title: POSEIDON Optimization Input
description: Optimization experiment input for POSEIDON policy and parameter search.
type: object
required:
  - baseScenario
  - parameters
  - objective
properties:
  baseScenario:
    oneOf:
      - type: string
      - $ref: bblocks://ogc.hosted.seadots.poseidon-input-scenario
  algorithm:
    type: string
    default: Bayesian optimization
  parameters:
    type: array
    minItems: 1
    items:
      type: object
      required:
        - name
        - adaptor
      properties:
        name:
          type: string
        adaptor:
          type: string
          description: POSEIDON parameter adaptor path or implementation name.
        lowerBound:
          type: number
        upperBound:
          type: number
        values:
          type: array
  objective:
    type: object
    required:
      - metric
    properties:
      metric:
        type: string
      direction:
        type: string
        enum: [minimize, maximize]
      expression:
        type: string
    additionalProperties: true
  simulationBudget:
    type: integer
    minimum: 1
  seed:
    type: integer
  replicatesPerEvaluation:
    type: integer
    minimum: 1
additionalProperties: true
