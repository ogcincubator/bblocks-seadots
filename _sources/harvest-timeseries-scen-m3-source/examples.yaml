examples:
  - title: Full source GeoJSON export
    description: >
      The complete supplied harvest_timeseries_scenario_Scen_M3 export, unmodified:
      19,920 Point features (83 spatial-series identifiers x 240 timestamps).
      Provenance is the supplied local export; no source endpoint was provided. Run
      transforms/extract-representative-sample.jq against this file to derive a
      smaller six-feature representative subset (identifiers 1, 42 and 83 at the
      first and final timestamps) when a compact example is more useful than the
      full export.
    snippets:
      - language: json
        ref: examples/harvest-timeseries-scen-m3-sample.geojson
