- title: Reef-associated biomass — per-cell GeoParquet
  description: >
    Primary scientific output of the Utsira surroundings experiment.
    Sum-over-taxa reef biomass attached to submerged infrastructure, gridded
    over the AOI. Bound to the `reef_biomass_geoparquet` CWL output port.
  snippets:
    - language: json
      ref: examples/reef_biomass_geoparquet.json

- title: STAC catalog — Utsira surroundings reef-biomass run
  description: >
    STAC catalog indexing inputs, the run, and the GeoParquet output. Bound to
    the `stac_catalog` CWL output port and conforms to the SeaDOTs EDITO
    output conventions.
  snippets:
    - language: json
      ref: examples/stac_catalog.json

- title: PROV-O provenance record (JSON-LD)
  description: >
    Provenance record closing the loop to the ODD demonstrator, the canonical
    reef-biomass equation record, and the per-taxon bindings resolved at run
    time. Bound to the `prov_record` CWL output port and conforms to
    CWLProv 0.6.
  snippets:
    - language: json
      ref: examples/prov_record.json
