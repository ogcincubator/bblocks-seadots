$schema: https://json-schema.org/draft/2020-12/schema
title: Computational Experiment Output
description: >
  OGC API Records profile for a single output artefact produced by a
  computational experiment. Extends GeoDCAT-Records with an `experimentOutput`
  sub-object that ties the artefact to an output role, a format, a vocabulary
  term for the produced quantity, the experiment it belongs to, and optional
  conformance classes.

allOf:
  - $ref: bblocks://ogc.geo.geodcat.geodcat-records

properties:
  properties:
    type: object
    required: [experimentOutput]
    properties:
      experimentOutput:
        type: object
        required: [name, role, format]
        properties:
          name:
            type: string
          description:
            type: string
          role:
            type: string
            description: >
              `primary result`, `catalog`, `provenance`, `diagnostic`.
          format:
            type: string
            description: Media type or format profile URI.
          vocabularyTerm:
            type: string
            format: uri
            description: Concept URI for the produced quantity.
          experiment:
            type: string
            format: uri
            description: URI of the experiment record that produced this output.
          observedProperty:
            type: string
            format: uri
            description: >
              SOSA-aligned. URI of the property observed by this output. For
              the reef-biomass result this is the `floating-wind-reef-biomass`
              indicator URI. Carrying this field aligns the record with the
              OIM-OBS / SOSA observation profile.
          hasSimpleResult:
            description: >
              SOSA-aligned. The simple (scalar or short structured) result of
              the observation/calculation. Type follows the observed property;
              for B_reef this is the headline scalar in kg with units carried
              by `hasSimpleResultUnit`.
          hasSimpleResultUnit:
            type: string
            description: Units of `hasSimpleResult` (e.g. `kg`, `t`, `kg m-2`).
          resultTime:
            type: string
            format: date-time
            description: >
              SOSA-aligned. Time at which the result was produced or applies.
              For a standing-stock calculation, the end-of-scenario instant.
          phenomenonTime:
            description: >
              SOSA-aligned. Time interval over which the observed phenomenon
              occurred (e.g. the scenario interval). String, or object with
              `start` and `end` keys.
          hasFeatureOfInterest:
            type: string
            format: uri
            description: >
              SOSA-aligned. URI of the feature of interest (typically the AOI
              `area-of-interest` record, typically).
          conformsTo:
            type: array
            description: Conformance classes the output is expected to satisfy.
            items:
              type: string
              format: uri
          aggregation:
            type: string
            description: >
              How the output aggregates over the equation index, when applicable
              (e.g. `sum-over-i`, `per-taxon`, `scalar`).
          data:
            type: object
            required: [provenance]
            description: >
              Representative inline result of this output. For a primary
              result, typically a `headline` scalar/CI plus `perTaxon`,
              `timeSeries`, and `uncertainty` sub-objects. For a catalog or
              provenance record, may be a small structural sample. Shape is
              format-specific and not further constrained.
            properties:
              provenance:
                type: object
                required: [values]
                description: >
                  Source pointer for every concrete value in this `data` block.
                  Required on every example.
                properties:
                  values:
                    type: string
                    enum: [computed, retrieved, illustrative, mixed]
                    description: >
                      `computed` — values are the deterministic result of
                      applying the documented equation to the cited input
                      records (must list `derivedFrom`). `retrieved` — values
                      came from the cited API call. `illustrative` —
                      placeholders for schema shape. `mixed` — some are
                      computed/retrieved and the rest are illustrative,
                      annotated in-line.
                  derivedFrom:
                    type: array
                    description: >
                      URIs of the input records that drive these values.
                      Required when `values=computed`.
                    items:
                      type: string
                      format: uri
                  equationRecord:
                    type: string
                    format: uri
                    description: >
                      URI of the equation-property-relationship record that
                      defines the closed-form expression evaluated here.
                  computedOn:
                    type: string
                    format: date
                    description: ISO date the values were last computed.
                  computeCode:
                    type: string
                    format: uri
                    description: >
                      URI of the script / notebook that produced these values.
                  uncertaintyMethod:
                    type: string
                    description: >
                      Name of the uncertainty-propagation method applied
                      (e.g. `log-linear CV`, `Monte Carlo`, `analytic
                      first-order`).
                  note:
                    type: string
