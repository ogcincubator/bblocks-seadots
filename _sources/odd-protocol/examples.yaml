- title: ODD Protocol second update — Grimm et al. 2020 (JASSS)
  description: >
    OGC Records representation of the canonical ODD Protocol paper published in
    the Journal of Artificial Societies and Social Simulation, 23(2)7, 2020.
    Demonstrates the bibliographic scaffold (GeoDCAT-Records) combined with the
    seven-element `odd` extension covering the paper's meta-level ODD template.
  snippets:
    - language: json
      ref: examples/jasss_odd_protocol_2020.json

- title: OSMOSE — marine multispecies IBM (ODD)
  description: >
    OGC Records representation of the OSMOSE (Object-oriented Simulator of
    Marine Ecosystems) model described using the ODD Protocol. OSMOSE is a
    spatially-explicit multispecies individual-based model for marine fish
    communities using size-based predation and super-individual (school)
    aggregation. Demonstrates full vocabulary annotation with NERC P01, CF
    standard names, Darwin Core, and WoRMS/OBIS AphiaID mappings on entity
    state variables, input data, and submodel equations (Von Bertalanffy,
    Gompertz, predation size-ratio, starvation, reproduction, spatial
    distribution).
  snippets:
    - language: json
      ref: examples/osmose_odd.json

- title: Utsira reef-biomass demonstrator — one-submodel ODD with linked equation record
  description: >
    Minimal demonstrator ODD that has a single submodel — the reef-biomass
    equation B_{reef} = sum_i (A_{sub} . D_{pre,i} . AF_i . C_t) — and
    delegates the full symbol table, dimensional typing, per-taxon bindings
    (Mytilus / Buccinum / Asterias) and provenance to the linked
    `equation-property-relationship` instance
    (`reef-biomass-equation.json` in `bblocks-seadots`). Shows the cross-bblock
    composition pattern: ODD carries narrative + scheduling + entities, and
    each submodel cites its equation by URI rather than re-declaring symbols
    and bindings inline.
  snippets:
    - language: json
      ref: examples/utsira_reef_biomass_demonstrator.json

# Note: the bundled experiment record that previously lived here has been
# factored into three dedicated building blocks:
#   _sources/experiment/                — the experiment record itself
#   _sources/area-of-interest/                  — AOI polygon
#   _sources/floating-wind-infrastructure/      — submerged geometry → A_sub
#   _sources/benthic-biomass-density-mareano/   — D_pre,i primary (SOSA Observation)
#   _sources/benthic-biomass-density-imr/       — D_pre,i fallback (SOSA Observation)
#   _sources/reef-aggregation-index/            — AF_i per taxon
#   _sources/colonisation-time-factor/          — C_t sigmoid
#   _sources/experiment-output/         — one record per output artefact
# A CWL Application Package previously lived here as well, but it referenced
# a placeholder container that does not exist; it has been removed. The real
# reproducibility artefact is the Python script at
# _sources/experiment/scripts/utsira_reef_biomass.py — linked from the
