$schema: https://json-schema.org/draft/2020-12/schema
title: EMODnet windfarm source feature snapshot
description: Raw Poland-filtered EMODnet source fields used in the exercise snapshot.
type: object
required: [id, type, geometry, properties]
properties:
  id: {type: string}
  type: {const: Feature}
  geometry:
    type: object
    required: [type, coordinates]
    properties:
      type: {const: Point}
      coordinates:
        type: array
        prefixItems: [{type: number}, {type: number}]
        minItems: 2
        maxItems: 2
    additionalProperties: false
  properties:
    type: object
    required: [name, status, power_mw, n_turbines, year, dist_coast_m, updateyear, lon, lat]
    properties:
      name: {type: string}
      status: {type: string}
      power_mw: {type: string}
      n_turbines: {type: string}
      year: {type: string}
      dist_coast_m: {type: string}
      updateyear: {type: string}
      lon: {type: string}
      lat: {type: string}
    additionalProperties: false
additionalProperties: false
