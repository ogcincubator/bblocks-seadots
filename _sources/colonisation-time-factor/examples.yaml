- title: Colonisation time factor — default sigmoid
  description: >
    Logistic sigmoid C(t) = L / (1 + exp(-k(t - t0))) with parameters and
    lookup table at t = 0, 6, 12, 18, 24 months. Values are illustrative;
    real calibration requires fitting to a published time series.
