$schema: https://json-schema.org/draft/2020-12/schema
title: EMODnet windfarm feature
description: >
  GeoJSON representation of the EMODnet Human Activities windfarms feature
  type. Property names, optionality, nullability, and value types follow the
  service's published windfarms XSD.
type: object
required: [id, type, geometry, properties]
properties:
  id:
    type: string
  type:
    const: Feature
  geometry:
    description: EMODnet the_geom represented as GeoJSON geometry; the XSD allows it to be nil.
    oneOf:
      - type: 'null'
      - type: object
        required: [type, coordinates]
        properties:
          type:
            enum: [Point, MultiPoint, LineString, MultiLineString, Polygon, MultiPolygon, GeometryCollection]
          coordinates: {}
        additionalProperties: true
  properties:
    type: object
    properties:
      country:
        type: [string, 'null']
        description: Country name as published by EMODnet; the XSD type is nullable xsd:string.
      n_turbines:
        type: [number, 'null']
      power_mw:
        type: [number, 'null']
      status:
        type: [string, 'null']
        description: Status text as published by EMODnet (nullable xsd:string).
      type_inst:
        type: [string, 'null']
      updateyear:
        type: [string, 'null']
      year:
        type: [string, 'null']
      dist_coast:
        type: [number, 'null']
      notes:
        type: [string, 'null']
  additionalProperties: false
