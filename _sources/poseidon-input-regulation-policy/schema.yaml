$schema: https://json-schema.org/draft/2020-12/schema
title: POSEIDON Regulation and Policy Input
description: Management-policy and regulation input applied to POSEIDON scenarios.
type: object
properties:
  regulations:
    type: array
    items:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          examples: ["Seasonal Closure", "Protected Area", "Quota", "Gear Restriction"]
        startDay:
          type: integer
          minimum: 1
          maximum: 366
        endDay:
          type: integer
          minimum: 1
          maximum: 366
        species:
          type: array
          items:
            type: string
        areas:
          type: array
          items:
            type: object
            additionalProperties: true
        conditions:
          type: object
          additionalProperties: true
        actions:
          type: object
          additionalProperties: true
      additionalProperties: true
  shocks:
    type: array
    description: Time-varying interventions or exogenous changes applied during a run.
    items:
      type: object
      additionalProperties: true
additionalProperties: true
