$schema: https://json-schema.org/draft/2020-12/schema
title: Marine Area of Interest
description: >
  Simple GeoJSON Feature profile for a polygon-delimited marine area of
  interest. The AOI geometry is represented only by the top-level GeoJSON
  geometry member. The feature properties carry only a title and description.

type: object
required: [type, geometry, properties]
properties:
  type:
    const: Feature
  geometry:
    description: GeoJSON Polygon delimiting the AOI.
    type: object
    required: [type, coordinates]
    properties:
      type:
        const: Polygon
      coordinates:
        type: array
  properties:
    type: object
    required: [title, description]
    properties:
      title:
        type: string
      description:
        type: string
