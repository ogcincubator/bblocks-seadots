examples:
  - title: Reef aggregation index variable observation
    description: >
      Synthetic demonstrator observation showing a numeric value mapped to
      indp:reef-aggregation-index. Replace the value with source data when a
      measured or modelled reef aggregation index is available.
    snippets:
    - language: json
      ref: examples/reef-aggregation-index-observation.json
  - title: Utsira reef aggregation index observation features
    description: >
      FeatureCollection containing one OIM/SOSA observation feature for each
      taxon-specific reef aggregation index binding referenced by the
      reef-biomass equation record: Mytilus edulis, Buccinum undatum and
      Asterias rubens. Values are illustrative screening priors.
    snippets:
    - language: json
      ref: examples/utsira-reef-aggregation-index-observations.json
