"$schema": https://json-schema.org/draft/2020-12/schema
title: OIM Variable Observation
description: >
  OIM/SOSA observation profile for numeric variable and indicator values. The
  observedProperty field identifies the variable concept, such as
  indo:reef-aggregation-index, while hasResult carries the numeric value.
$defs:
  GeoJSONPoint:
    type: object
    required:
      - type
      - coordinates
    properties:
      type:
        type: string
        const: Point
      coordinates:
        type: array
        minItems: 2
        items:
          type: number
      bbox:
        type: array
        items:
          type: number
  VariableObservationResult:
    type: object
    required:
      - value
    properties:
      type:
        oneOf:
          - type: string
          - type: array
            items:
              type: string
      value:
        type: number
      unit:
        type: string
        format: uri-reference
      taxon:
        type: string
      taxonConcept:
        type: string
        format: uri-reference
      method:
        type: string
      evidence:
        type: string
        format: uri-reference
    additionalProperties: true
  OIMVariableObservationProps:
    type: object
    required:
      - observedProperty
      - hasResult
    properties:
      label:
        oneOf:
          - type: string
          - type: object
      observedProperty:
        type: string
        format: uri-reference
      hasResult:
        $ref: '#/$defs/VariableObservationResult'
      phenomenonTime:
        type: string
        format: date-time
      resultTime:
        type: string
        format: date-time
    additionalProperties: true
  OIMVariableObservationFeature:
    type: object
    required:
      - type
      - geometry
      - properties
    properties:
      "@context": true
      "@id":
        type: string
        format: uri-reference
      id:
        type: string
        format: uri-reference
      type:
        type: string
        const: Feature
      geometry:
        oneOf:
          - type: "null"
          - $ref: '#/$defs/GeoJSONPoint'
      properties:
        $ref: '#/$defs/OIMVariableObservationProps'
      links:
        type: array
    additionalProperties: true
  OIMVariableObservationCollection:
    type: object
    required:
      - type
      - features
    properties:
      "@context": true
      "@id":
        type: string
        format: uri-reference
      id:
        type: string
        format: uri-reference
      type:
        type: string
        const: FeatureCollection
      features:
        type: array
        items:
          $ref: '#/$defs/OIMVariableObservationFeature'
      links:
        type: array
    additionalProperties: true
anyOf:
  - $ref: '#/$defs/OIMVariableObservationProps'
  - $ref: '#/$defs/OIMVariableObservationFeature'
  - $ref: '#/$defs/OIMVariableObservationCollection'
