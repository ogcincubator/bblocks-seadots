examples:
  - title: NVE Smøla windfarm mapped to EMODnet with Norwegian source extension
    content: >-
      Worked Norway example. EMODnet properties carry the mapped country,
      operating status, turbine count, capacity, and year. The extension retains
      NVE's licensing status, owner, production, administrative areas, and
      turbine details. The NVE facility has GIS geometry, but it is omitted from
      this page-derived example and must be taken from the NVE spatial download
      before using the record as a mapped feature.
    snippets:
      - language: json
        ref: examples/operational-offshore-wind-farm.json
