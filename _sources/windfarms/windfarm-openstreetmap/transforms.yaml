transforms:
  - id: to-windfarm-designated-area
    description: >
      Converts an OSM API 0.6 map response into windfarm designated areas
      (`common-windfarm-designated-area`). The transformation is driven by the
      alignment declared in this block's `ontology.ttl`: `osmdata:WindfarmElement`
      selects wind farm ways and relations, and `osmdata:windfarmTagMappings`
      maps OSM tags onto `owf:` properties with their value conversions. A wind
      farm relation is merged with its outer and same-name ways, which become
      `same_as` links. Geometry comes from the area way, with `area_sqkm`
      computed geodesically. Turbines and other devices are not output. The
      output's `@context` references the target block's JSON-LD context.
    type: python
    ref: transforms/osm_to_windfarm_area.py
    inputs:
      mediaTypes:
        - application/json
    outputs:
      mediaTypes:
        - application/geo+json
        - application/json
      profiles:
        - bblocks://ogc.hosted.seadots.windfarms.common-windfarm-designated-area
    metadata:
      ontology: _sources/windfarms/windfarm-openstreetmap/ontology.ttl
      source_snapshot_date: '2026-10-27'
      dependencies:
        pip:
          - rdflib
          - pyproj
  - id: to-windfarm-turbine
    description: >
      Converts an OSM API 0.6 map response into wind turbines
      (`common-windfarm-turbine`). The transformation is driven by the alignment
      declared in this block's `ontology.ttl`: `osmdata:TurbineElement` selects
      `power=generator` nodes and `osmdata:turbineTagMappings` maps their tags onto
      `owf:` properties (rated power, hub height, rotor diameter, rotor axis,
      condition). Each turbine gets the wind farm relation it is a member of as
      `windfarm`, and the relation name as `windfarm_name`. The output's
      `@context` references the target block's JSON-LD context.
    type: python
    ref: transforms/osm_to_windfarm_turbine.py
    inputs:
      mediaTypes:
        - application/json
    outputs:
      mediaTypes:
        - application/geo+json
        - application/json
      profiles:
        - bblocks://ogc.hosted.seadots.windfarms.common-windfarm-turbine
    metadata:
      ontology: _sources/windfarms/windfarm-openstreetmap/ontology.ttl
      target_context: _sources/windfarms/common-windfarm-turbine/context.jsonld
      dependencies:
        pip:
          - rdflib
