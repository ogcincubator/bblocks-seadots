examples:
  - title: Single wind farm area (Baltic Power, OpenStreetMap)
    content: >
      The Baltic Power wind farm area converted from
      [OSM relation 21402440](https://www.openstreetmap.org/relation/21402440) and its outer way.
      `same_as` links the outer way and the matching EMODnet record.
      © [OpenStreetMap contributors](https://www.openstreetmap.org/copyright),
      [ODbL 1.0](https://opendatacommons.org/licenses/odbl/1-0/).
    snippets:
      - language: json
        ref: examples/osm-baltic-power-area.json
  - title: Wind farm areas from OSM, EMODnet, NVE and the Polish pipeline
    content: >
      FeatureCollection with one feature per source record: five Polish Baltic wind farms from the
      2026-10-27 OpenStreetMap snapshot, the matching five EMODnet Human Activities records
      (WFS, retrieved 2026-11-04), the NVE Smøla record from
      [emodnet-compliant-windfarm-no](../emodnet-compliant-windfarm-no/), and the national pipeline
      record from [emodnet-compliant-windfarm-pl](../emodnet-compliant-windfarm-pl/).
      Records of the same farm are linked with `same_as`. OSM data © OpenStreetMap contributors (ODbL 1.0).
    snippets:
      - language: json
        ref: examples/windfarm-areas-pl-no.json
