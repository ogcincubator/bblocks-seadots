$schema: https://json-schema.org/draft/2020-12/schema
title: Wind turbine
description: >
  A single wind turbine as a GeoJSON Feature with Point geometry, or a
  FeatureCollection of such turbines. Properties are harmonised from source
  tags: numeric values are parsed into SI-based units named in the property,
  and values that cannot be read unambiguously are null.
anyOf:
  - $ref: '#/$defs/WindTurbine'
  - $ref: '#/$defs/WindTurbineCollection'
$defs:
  WindTurbineCollection:
    allOf:
      - $ref: https://opengeospatial.github.io/bblocks/annotated-schemas/geo/features/featureCollection/schema.json
      - type: object
        required: [features]
        properties:
          features:
            type: array
            items: {$ref: '#/$defs/WindTurbine'}
  WindTurbine:
    allOf:
      - $ref: https://opengeospatial.github.io/bblocks/annotated-schemas/geo/features/feature/schema.json
      - type: object
        required: [id, geometry, properties]
        properties:
          id:
            type: string
            format: uri
            description: Persistent identifier of the turbine, e.g. its OpenStreetMap node URL.
          geometry:
            type: object
            required: [type, coordinates]
            properties:
              type: {const: Point}
          properties:
            type: object
            required: [ref, windfarm_name, windfarm, manufacturer, model, rated_power_mw,
                       hub_height_m, rotor_diameter_m, rotor_axis, offshore, operator, status,
                       last_updated]
            properties:
              ref:
                type: [string, 'null']
                description: Turbine reference label within its wind farm, as assigned by the source.
              windfarm_name:
                type: [string, 'null']
                description: Name of the wind farm the turbine belongs to.
              windfarm:
                type: [string, 'null']
                format: uri
                description: Identifier of the wind farm the turbine belongs to, e.g. its OpenStreetMap relation URL.
              manufacturer:
                type: [string, 'null']
                description: Turbine manufacturer name.
              model:
                type: [string, 'null']
                description: Turbine model designation.
              rated_power_mw:
                type: [number, 'null']
                minimum: 0
                description: Rated (nameplate) electrical output of the turbine in megawatts.
              hub_height_m:
                type: [number, 'null']
                minimum: 0
                description: Height of the rotor hub in metres.
              rotor_diameter_m:
                type: [number, 'null']
                minimum: 0
                description: Rotor diameter in metres.
              rotor_axis:
                enum: [horizontal_axis, vertical_axis, null]
                description: Orientation of the rotor axis.
              offshore:
                type: [boolean, 'null']
                description: Whether the turbine stands offshore; null when the source does not say.
              operator:
                type: [array, 'null']
                minItems: 1
                items: {type: string}
                description: Operating organisation(s).
              status:
                enum: [projected, underConstruction, functional, disused, decommissioned, null]
                description: >-
                  Condition of the turbine as an INSPIRE ConditionOfFacilityValue code;
                  null when the source does not state it.
              last_updated:
                type: [string, 'null']
                format: date-time
                description: Time of the last edit of the source record.
            additionalProperties: false
