$schema: https://json-schema.org/draft/2020-12/schema
title: EMODnet windfarm feature
description: >
  GeoJSON representation of the EMODnet Human Activities windfarms feature
  type, as a single Feature or a FeatureCollection such as a WFS response. Property names, optionality, nullability, and value types follow the
  service's published windfarms XSD.
anyOf:
  - $ref: '#/$defs/Windfarm'
  - $ref: '#/$defs/WindfarmCollection'
$defs:
  WindfarmCollection:
    allOf:
      - $ref: https://opengeospatial.github.io/bblocks/annotated-schemas/geo/features/featureCollection/schema.json
      - type: object
        required: [features]
        properties:
          features:
            type: array
            items: {$ref: '#/$defs/Windfarm'}
  Windfarm:
    allOf:
      - $ref: https://opengeospatial.github.io/bblocks/annotated-schemas/geo/features/feature/schema.json
      - type: object
        required: [properties]
        properties:
          properties:
            type: object
            properties:
              country:
                type: [string, 'null']
                description: Country name as published by EMODnet; the XSD type is nullable xsd:string.
              n_turbines:
                type: [number, 'null']
              power_mw:
                type: [number, 'null']
              status:
                type: [string, 'null']
                description: Status text as published by EMODnet (nullable xsd:string).
              type_inst:
                type: [string, 'null']
              updateyear:
                type: [string, 'null']
              year:
                type: [string, 'null']
              dist_coast:
                type: [number, 'null']
              notes:
                type: [string, 'null']
              shape_leng:
                type: [number, 'null']
              shape_area:
                type: [number, 'null']
              name:
                type: [string, 'null']
              area_sqkm:
                type: [number, 'null']
          additionalProperties: true
