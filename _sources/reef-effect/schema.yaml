$schema: https://json-schema.org/draft/2020-12/schema
title: Reef Effect
description: >
  SeaDOTs Catalog Workflow profile for a reef-effect computational
  experiment realising a documented model. Extends the generic catalog
  workflow with an `experiment` sub-object that points to the executable code
  (`application`) that runs the experiment, the documented model
  (`modelledBy`), the evidence equation (`evidenceEquation`), and standalone
  per-class input and `reef-effect-output` records referenced by URI.

allOf:
  - $ref: https://ogcincubator.github.io/bblocks-seadots/build/annotated/hosted/seadots/catalog-workflow/schema.json

$defs:
  Link:
    type: object
    required: [href]
    properties:
      href:
        type: string
        format: uri
      rel:
        type: string
      type:
        type: string
      title:
        type: string

  InputBinding:
    description: >
      Reference to a per-class input record (`href`) plus the wiring that
      ties it to this experiment. The referenced record is reusable and
      carries no wiring of its own.
    type: object
    required: [href]
    properties:
      href:
        type: string
        format: uri
        description: URI of the per-class input record being consumed.
      rel:
        type: string
      type:
        type: string
      title:
        type: string
      equationBinding:
        type: [string, "null"]
        description: >
          Symbol from the linked equation-property-relationship record that
          this input parameterises in this experiment (e.g. `A_{sub}`,
          `D_{pre,i}`, `AF_i`, `C_t`). Omit or set to `null` when the input
          is not bound to an equation symbol (e.g. the AOI).

properties:
  properties:
    type: object
    required: [experiment]
    properties:
      softwareType:
        type: string
        description: >
          More specific software/catalog type retained from the specialised
          reef-effect workflow record, e.g. schema.org SoftwareSourceCode.
      experiment:
        type: object
        required: [kind, application]
        properties:
          kind:
            type: string
            enum: [computational, observational, mesocosm, in-situ]
          purpose:
            type: string
          application:
            $ref: '#/$defs/Link'
            description: >
              Link to the executable code that runs this experiment. Any
              language or format that exists and runs (Python script,
              Jupyter notebook, R script, etc.). The `type` field SHOULD
              carry the media type (e.g. `text/x-python`).
          modelledBy:
            $ref: '#/$defs/Link'
            description: Link to the model documentation (e.g. an ODD record) this experiment realises.
          evidenceEquation:
            $ref: '#/$defs/Link'
            description: Link to an `equation-property-relationship` record carrying the symbol table.
          parameters:
            type: array
            items:
              type: object
              required: [name]
              properties:
                name: { type: string }
                title: { type: string }
                description: { type: string }
                parameterSchema:
                  type: object
                  description: Inline JSON Schema fragment for the parameter value.
                vocabularyTerm:
                  type: string
                  format: uri
          inputs:
            type: array
            description: >
              References to per-class input records. Each entry MAY carry
              an `equationBinding` symbol. MUST NOT inline the input record
              itself.
            items:
              $ref: '#/$defs/InputBinding'
          outputs:
            type: array
            description: References to `reef-effect-output` records. MUST NOT be inlined.
            items:
              $ref: '#/$defs/Link'
          execution:
            type: object
            properties:
              language:
                type: string
                description: >
                  Language or runtime the application is written in
                  (e.g. `python`, `r`, `jupyter`, `bash`).
              languageVersion:
                type: string
                description: Minimum interpreter / runtime version.
              dependencies:
                type: array
                description: Runtime dependencies (e.g. PyPI packages with version specs).
                items: { type: string }
              entrypoint:
                type: string
                description: >
                  Command line to invoke the application from the repository
                  root (e.g. `python3 _sources/reef-effect/scripts/foo.py`).
              scheduling:
                type: string
              reproducibility:
                type: object
                properties:
                  seedPolicy: { type: string }
                  provenance: { type: string }
          successCriteria:
            type: array
            items: { type: string }
