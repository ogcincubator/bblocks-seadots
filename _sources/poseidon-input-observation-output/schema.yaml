$schema: https://json-schema.org/draft/2020-12/schema
title: POSEIDON Observation and Output Selection Input
description: Input selecting which POSEIDON observations and output series are written.
type: object
properties:
  columns:
    type: array
    items:
      type: string
    description: Names of POSEIDON output columns, indicators, or time series.
  cadence:
    type: string
    enum: [daily, yearly, end-of-run, custom]
  loggers:
    type: array
    items:
      type: object
      required:
        - type
      properties:
        type:
          type: string
      additionalProperties: true
  outputProducts:
    type: array
    items:
      oneOf:
        - type: string
          format: uri
        - $ref: bblocks://ogc.osc.geodcat-stac-earthcode.products
additionalProperties: true
