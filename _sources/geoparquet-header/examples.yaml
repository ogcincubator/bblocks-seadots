examples:
  - title: Generic stations GeoParquet header
    description: >
      Minimal, dataset-agnostic example of the GeoParquetHeader envelope: four
      columns (a Point geometry plus three scalar properties) over a tiny
      synthetic stations source. `crs` is explicitly `null`, illustrating the
      spec-conformant default-to-OGC:CRS84 case rather than a hand-typed CRS
      shorthand.
    snippets:
      - language: json
        ref: examples/generic-stations-header.json
