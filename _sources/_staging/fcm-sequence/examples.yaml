examples:
  - title: Six weeks of the researcher proposal map
    description: >
      Copied byte-for-byte from
      `dataspecs/example__sequence_toy_example_researcher_proposal__20260630.json` of
      FuzzyCognitiveMapTools.jl. Six steps, weeks 19 to 24 of 2026, each carrying the
      full ten-concept fourteen-edge map and its single ten-component equilibrium.

      The example is worth reading as a whole rather than as a shape, because it shows
      what a sequence is for. Exactly one edge changes across the six steps -- `C2 -> C3`,
      "Stress Level" driving "Dark Chocolate Consumption", strengthening 0 -> 0.2 -> 0.4
      -> 0.7 -> 0.8 -> 0.9. Every other weight is identical at every step. The
      equilibrium follows: the C3 component rises 0.457 -> 0.487 -> 0.517 -> 0.563 ->
      0.578 -> 0.593, while the C1 component stays pinned at 0.5 throughout. A sequence
      is thus a record of a causal claim strengthening between elicitation rounds, and
      of what that does to the system's resting state.

      Every value is the upstream author's; nothing here was generated or altered.
    snippets:
      - language: json
        ref: examples/sequence-researcher-proposal.json
