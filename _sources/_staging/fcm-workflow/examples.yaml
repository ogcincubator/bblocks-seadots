examples:
  - title: FuzzyCognitiveMapTools.jl solver
    description: >
      Workflow record for the solver as it exists in v0.1.0. Every value in the `solver`
      object is read from the source rather than chosen: the three supported activation
      concepts are the three branches of `to_proc`, `kosko` is the hard-coded update in
      `single_fcm_trial`, and each execution parameter carries the default compiled into
      that function or into `run_trials`. The `refinement` block records the separate --
      and different -- settings the centroid-refinement pass uses.

      The discovery metadata around it (title, description, method, keywords) is
      editorial, written for this record.
    snippets:
      - language: json
        ref: examples/fcm-solver-workflow.json
