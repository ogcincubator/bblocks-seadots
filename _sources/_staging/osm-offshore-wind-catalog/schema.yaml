$schema: https://json-schema.org/draft/2020-12/schema
title: OSM Polish Offshore Wind Catalog Record
description: >
  Catalog record profile for a dated GeoJSON snapshot of OpenStreetMap features.
  The catalog record envelope reuses SeaDOTs catalog-data-tabular for shared
  catalog metadata; the referenced data asset remains GeoJSON and is not
  described as a CSV, table, or time series. Source-specific feature data are
  represented as GeoJSON features whose properties contain OSM identifiers and
  the original OSM tag map.

allOf:
  - $ref: bblocks://ogc.hosted.seadots.catalog-data-tabular

type: object
required:
  - type
  - itemType
  - properties
  - assets
  - links
properties:
  type:
    const: Feature
  itemType:
    const: record
  properties:
    type: object
    required:
      - title
      - description
      - datetime
    properties:
      datetime:
        type: [string, 'null']
        description: >
          Null when only a date (not a date-time) is evidenced. Snapshot date is
          recorded separately in retrieved; this is not an observation
          timestamp or time series.
      start_datetime:
        type: string
        format: date-time
        description: >
          For date-only source provenance, UTC start of the snapshot calendar
          day; this is a calendar-day bound, not an observed retrieval time.
      end_datetime:
        type: string
        format: date-time
        description: >
          For date-only source provenance, UTC end of the snapshot calendar
          day; this is a calendar-day bound, not an observed retrieval time.
      license:
        const: ODbL-1.0
      attribution:
        const: OpenStreetMap contributors
      source:
        const: https://api.openstreetmap.org/api/0.6/map
      retrieved:
        type: string
        format: date
        description: Evidenced retrieval date; source does not provide time of day.
      coverage_note:
        type: string
        description: Textual caveat on geographic/selection coverage of the snapshot.
      feature_count:
        type: integer
        minimum: 0
      geometry_counts:
        type: object
        properties:
          Point:
            type: integer
            minimum: 0
          Polygon:
            type: integer
            minimum: 0
          'null':
            type: integer
            minimum: 0
      extent:
        type: array
        prefixItems:
          - type: number
          - type: number
          - type: number
          - type: number
        minItems: 4
        maxItems: 4
        description: WGS 84 bbox [west, south, east, north] over available geometries.
    additionalProperties: true
  assets:
    type: object
    required:
      - data
    properties:
      data:
        type: object
        required:
          - href
          - type
        properties:
          type:
            const: application/geo+json
          roles:
            contains:
              const: data
    additionalProperties: true
  links:
    type: array
    allOf:
      - contains:
          type: object
          required: [rel, href]
          properties:
            rel:
              const: profile
            href:
              const: bblocks://ogc.hosted.seadots.catalog-data-tabular
      - contains:
          type: object
          required: [rel, href]
          properties:
            rel:
              const: profile
            href:
              const: bblocks://ogc.hosted.seadots.osm-offshore-wind-source
      - contains:
          type: object
          required: [rel, href]
          properties:
            rel:
              const: profile
            href:
              const: bblocks://ogc.hosted.seadots.emodnet-windfarm-osm
