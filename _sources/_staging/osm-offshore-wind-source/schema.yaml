$schema: https://json-schema.org/draft/2020-12/schema
title: OpenStreetMap offshore wind snapshot
description: >-
  Source-aligned GeoJSON FeatureCollection. Feature fields and OSM properties
  retain the supplied source representation; geometry is nullable and may be
  Point or Polygon in this snapshot. Tag keys and values remain uninterpreted.
type: object
required: [type, source, features]
properties:
  type:
    const: FeatureCollection
  source:
    type: string
    description: Source attribution, API endpoint, retrieval date, and geographic filter recorded with the snapshot.
  features:
    type: array
    items:
      type: object
      required: [id, type, geometry, properties]
      properties:
        id:
          type: string
          description: Original OSM element reference in type/id form, such as node/123.
        type:
          const: Feature
        geometry:
          oneOf:
            - type: 'null'
            - type: object
              required: [type, coordinates]
              properties:
                type:
                  enum: [Point, Polygon]
                coordinates: {}
              additionalProperties: true
        properties:
          type: object
          required: [osm_type, osm_id, tags]
          properties:
            osm_type:
              type: string
              enum: [node, way, relation]
              description: OSM element kind.
            osm_id:
              type: integer
              minimum: 0
              description: Numeric identifier scoped by osm_type.
            tags:
              type: object
              description: Unmodified key-value tags from the source; keys and values are source-defined strings.
              additionalProperties:
                type: string
            members:
              type: array
              description: Source member references with roles for OSM relations, preserved in source order.
              items:
                type: string
          additionalProperties: true
      additionalProperties: false
additionalProperties: false
