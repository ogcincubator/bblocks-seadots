  - title: Raw OSM API XML response for the supplied GeoJSON extent (2026-11-02)
    content: >-
      Unconverted XML response body saved directly from the OSM API. This is a fresh snapshot,
      not a reproduction of the 2026-10-27 GeoJSON artifact: its original request bounds were
      unavailable, so this request uses that artifact's extent (16.74361,54.953732,17.78045,55.13824).
      Retrieved 2026-11-02 under the [ODbL 1.0](https://opendatacommons.org/licenses/odbl/1-0/);
      attribution: [OpenStreetMap contributors](https://www.openstreetmap.org/copyright).
      Source request: [OSM API map endpoint](https://api.openstreetmap.org/api/0.6/map?bbox=16.74361,54.953732,17.78045,55.13824).
    snippets:
      - language: xml
        ref: examples/osm-polish-offshore-wind-raw-2026-11-02.osm
