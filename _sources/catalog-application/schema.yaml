$schema: https://json-schema.org/draft/2020-12/schema
title: SeaDOTs Catalog Application
description: >
  OGC API Records profile for a reusable application, workflow, model, transformer, or process.

allOf:
  - $ref: bblocks://ogc.geo.geodcat.geodcat-records

type: object
required: [id, type, itemType, properties]
properties:
  id:
    type: string
  type:
    const: Feature
  itemType:
    const: record
  conformsTo:
    type: array
    items:
      type: string
      format: uri
  geometry:
    type: ["object", "null"]
  bbox:
    type: array
    items:
      type: number
  properties:
    type: object
    required: [title, description, type, applicationCategory]
    properties:
      title:
        type: string
      description:
        type: string
      type:
        const: Application
      applicationCategory:
        type: string
        enum: [DigitalTwinApplication, Workflow, Transform, Model, Service]
      softwareVersion:
        type: string
      programmingLanguage:
        type: string
      applicationPackage:
        type: string
        format: uri
      workflow:
        type: string
        format: uri
      inputs:
        type: array
        description: Input profiles accepted by this application.
        items:
          type: object
          required: [profileId, required]
          properties:
            profileId:
              type: string
              description: URI or fully qualified building block identifier of the accepted input profile.
            required:
              type: boolean
              description: Whether this input profile is required to execute the application.
            role:
              type: string
              description: Application-specific input role.
            description:
              type: string
      outputs:
        type: array
        description: Output profiles produced by this application.
        items:
          type: object
          required: [profileId, required]
          properties:
            profileId:
              type: string
              description: URI or fully qualified building block identifier of the produced output profile.
            required:
              type: boolean
              description: Whether this output profile is always produced by the application.
            role:
              type: string
              description: Application-specific output role.
            description:
              type: string
      keywords:
        type: array
        items:
          type: string
      license:
        type: string
        format: uri
    additionalProperties: true

  links:
    type: array
    items:
      type: object
      required: [rel, href]
      properties:
        rel:
          type: string
        href:
          type: string
        type:
          type: string
        title:
          type: string
