$schema: https://json-schema.org/draft/2020-12/schema
title: POSEIDON Run Control Input
description: Top-level execution controls for a POSEIDON run or batch of runs.
type: object
required:
  - scenario
  - yearsToRun
properties:
  scenario:
    oneOf:
      - type: string
        description: Path or URI to a POSEIDON scenario YAML file.
      - $ref: bblocks://ogc.hosted.seadots.poseidon-input-scenario
  policy:
    oneOf:
      - type: "null"
      - type: string
        description: Path or URI to an optional policy, regulation, or shock YAML file.
      - $ref: bblocks://ogc.hosted.seadots.poseidon-input-regulation-policy
  yearsToRun:
    type: integer
    minimum: 1
  randomSeed:
    type: integer
    description: Seed used for reproducible stochastic runs.
  replicates:
    type: integer
    minimum: 1
    default: 1
  outputDirectory:
    type: string
  outputSelection:
    oneOf:
      - type: "null"
      - type: string
      - $ref: bblocks://ogc.hosted.seadots.poseidon-input-observation-output
additionalProperties: true
