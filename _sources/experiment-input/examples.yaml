- title: AOI — surroundings of Utsira island
  description: >
    Polygon delimiting the broader Utsira surroundings study area. Bound to
    the `aoi` CWL input of the Utsira reef-biomass experiment; not bound to
    any equation symbol.
  snippets:
    - language: json
      ref: examples/aoi_utsira_surroundings.json

- title: Submerged infrastructure layout — Utsira Nord 60 × 15 MW
  description: >
    Per-unit submerged geometry for the 60 × 15 MW floating-wind units. Bound
    to the equation symbol `A_{sub}` and to the `infrastructure_layout` CWL
    input.
  snippets:
    - language: json
      ref: examples/infrastructure_layout_60x15mw.json

- title: MAREANO benthic biomass density — primary baseline (D_{pre,i})
  description: >
    Primary baseline density source, scattered over taxon index i. Bound to
    the equation symbol `D_{pre,i}` and to the `baseline_density_primary` CWL
    input.
  snippets:
    - language: json
      ref: examples/mareano_baseline_density.json

- title: IMR benthic biomass baseline — fallback (D_{pre,i})
  description: >
    Fallback baseline density used where MAREANO has no taxon coverage at i.
    Bound to the equation symbol `D_{pre,i}` and to the
    `baseline_density_fallback` CWL input.
  snippets:
    - language: json
      ref: examples/imr_baseline_density_fallback.json

- title: Reef aggregation index bindings (AF_i)
  description: >
    Per-taxon AF_i bindings resolved from the canonical reef-biomass equation
    record. Bound to the equation symbol `AF_i` and to the `equation_record`
    CWL input.
  snippets:
    - language: json
      ref: examples/reef_aggregation_index_bindings.json

- title: Colonisation time factor (C_t) — default sigmoid
  description: >
    Scalar colonisation factor evaluated at scenario T0 + 24 months. Bound to
    the equation symbol `C_t` and to the `equation_record` CWL input.
  snippets:
    - language: json
      ref: examples/colonisation_time_factor.json
