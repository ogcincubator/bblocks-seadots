$schema: https://json-schema.org/draft/2020-12/schema
title: EMODnet-compliant protected area (common envelope)
description: >
  Common GeoJSON Feature envelope shared by all EMODnet-compliant protected-area
  profiles. Geometry is a (Multi)Polygon in CRS84 (longitude, latitude, WGS 84), one
  feature per site (multi-part sites are dissolved into a single MultiPolygon, as in
  the EMODnet layers). The attribute set is fixed by the child profiles, which keep
  EMODnet's published WFS field names and primitive types unchanged.
$defs:
  Feature:
    allOf:
      - $ref: bblocks://ogc.geo.features.feature
      - type: object
        required: [type, id, geometry, properties]
        properties:
          type:
            const: Feature
          id:
            description: >
              Stable feature identifier. Child profiles fix which EMODnet attribute supplies it
              (natdaid for nationally designated areas, code for RSC MPAs).
            type: [string, integer]
          geometry:
            type: object
            required: [type, coordinates]
            properties:
              type:
                enum: [Polygon, MultiPolygon]
              coordinates:
                type: array
                minItems: 1
          properties:
            type: object
  FeatureCollection:
    description: A FeatureCollection whose every member is a Feature of this profile.
    allOf:
      - $ref: bblocks://ogc.geo.features.featureCollection
      - type: object
        properties:
          features:
            type: array
            items:
              $ref: '#/$defs/Feature'
oneOf:
  - $ref: '#/$defs/Feature'
  - $ref: '#/$defs/FeatureCollection'
