examples:
  - title: Hatter Barn HELCOM MPA as published by EMODnet
    content: >
      A real record from the EMODnet Human Activities WFS (`rsc = HELCOM`, `code = 252`,
      retrieved 30 Sep 2026), used as the golden target for the HELCOM transform.
      Attribute values are verbatim; fields EMODnet leaves empty for HELCOM sites are null.
      The geometry is the site's WGS 84 bounding box, not the true boundary.
    snippets:
      - language: json
        ref: examples/emodnet-hatter-barn.json
  - title: EMODnet reference records for HELCOM codes 252 and 239
    content: >
      The EMODnet marineprotectedareas records for Hatter Barn (252) and Jasmund National Park (239),
      retrieved 30 Sep 2026; golden targets of the HELCOM transform.
    snippets:
      - language: json
        ref: examples/emodnet-reference-helcom.geojson
