examples:
  - title: Collection description for the Norwegian EMODnet view (target design)
    content: >
      **Illustrative target design, not a live response.** The collection
      `emodnet-view-no-nationallydesignatedareas` is specified here but not yet deployed on the Seadots
      pygeoapi instance. The document shows the collection description it must serve: profile, schema,
      queryables, source collection, corresponding EMODnet layer, source metadata, licence and the
      transform report, all reachable as links. Link targets to EMODnet, Geonorge and the licence are real;
      the Seadots API URLs point at a local pygeoapi instance (localhost:5000).
    snippets:
      - language: json
        ref: examples/emodnet-view-no-nationallydesignatedareas.json
  - title: Collection description for the HELCOM EMODnet view (target design)
    content: >
      **Illustrative target design, not a live response.** The collection `emodnet-view-helcom-rsc-mpa`
      (HELCOM MADS layer 54 transformed to EMODnet marineprotectedareas with rsc = HELCOM) is specified
      here but not yet deployed. Link targets to HELCOM, EMODnet and the licence are real; the Seadots API
      URLs point at a local pygeoapi instance (localhost:5000).
    snippets:
      - language: json
        ref: examples/emodnet-view-helcom-rsc-mpa.json
