$schema: https://json-schema.org/draft/2020-12/schema
title: SeaDOTs Catalog Execution
description: >
  OGC API Records profile for a concrete workflow execution or experiment run
  that links to reusable catalog records instead of duplicating their metadata.

allOf:
  - $ref: https://ogcincubator.github.io/geodcat-ogcapi-records/build/annotated/geo/geodcat/geodcat-records-prov/schema.yaml

type: object
properties:
  "@context":
    oneOf:
      - type: string
        format: uri-reference
      - type: object
      - type: array
        items:
          oneOf:
            - type: string
              format: uri-reference
            - type: object
  type:
    const: Feature
  itemType:
    const: record
  properties:
    type: object
    required: [type, workflow, inputRecords, outputRecords]
    properties:
      type:
        const: Execution
      workflow:
        type: string
        format: uri-reference
        description: Relative or absolute reference to the workflow record instantiated by this execution.
      startTime:
        type: string
        format: date-time
      endTime:
        type: string
        format: date-time
      status:
        type: string
      parameters:
        type: object
      inputRecords:
        type: array
        minItems: 1
        items:
          type: string
          format: uri-reference
      outputRecords:
        type: array
        minItems: 1
        items:
          type: string
          format: uri-reference
    additionalProperties: true
