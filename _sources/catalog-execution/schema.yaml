$schema: https://json-schema.org/draft/2020-12/schema
title: SeaDOTs Catalog Execution
description: >
  OGC API Records profile for a concrete workflow execution or experiment run.

allOf:
  - $ref: bblocks://ogc.geo.geodcat.geodcat-records

type: object
required: [id, type, itemType, properties]
properties:
  id:
    type: string
  type:
    const: Feature
  itemType:
    const: record
  conformsTo:
    type: array
    items:
      type: string
      format: uri
  geometry:
    type: ["object", "null"]
  bbox:
    type: array
    items:
      type: number
  properties:
    type: object
    required: [title, description, type, workflow, application, startTime]
    properties:
      title:
        type: string
      description:
        type: string
      type:
        const: Execution
      application:
        type: string
        format: uri
      workflow:
        type: string
        format: uri
        description: URI of the workflow plan instantiated by this execution.
      startTime:
        type: string
        format: date-time
      endTime:
        type: string
        format: date-time
      status:
        type: string
      parameters:
        type: object
      inputRecords:
        type: array
        items:
          type: string
          format: uri
      outputRecords:
        type: array
        items:
          type: string
          format: uri
    additionalProperties: true

  links:
    type: array
    items:
      type: object
      required: [rel, href]
      properties:
        rel:
          type: string
        href:
          type: string
        type:
          type: string
        title:
          type: string
