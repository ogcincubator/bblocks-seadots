$schema: https://json-schema.org/draft/2020-12/schema
title: SeaDOTs Catalog Execution
description: >
  OGC API Records profile for a concrete workflow execution or experiment run
  that links to reusable catalog records instead of duplicating their metadata.

allOf:
  - $ref: bblocks://ogc.geo.geodcat.geodcat-records

type: object
required: [id, type, itemType, properties]
properties:
  id:
    type: string
  type:
    const: Feature
  itemType:
    const: record
  conformsTo:
    type: array
    items:
      type: string
      format: uri
  geometry:
    type: ["object", "null"]
  bbox:
    type: array
    items:
      type: number
  properties:
    type: object
    required: [type, workflow, application, inputRecords, outputRecords]
    properties:
      type:
        const: Execution
      application:
        type: string
        format: uri-reference
        description: Relative or absolute reference to the catalog application record.
      workflow:
        type: string
        format: uri-reference
        description: Relative or absolute reference to the workflow plan record instantiated by this execution.
      startTime:
        type: string
        format: date-time
      endTime:
        type: string
        format: date-time
      status:
        type: string
      parameters:
        type: object
      inputRecords:
        type: array
        minItems: 1
        items:
          type: string
          format: uri-reference
      outputRecords:
        type: array
        minItems: 1
        items:
          type: string
          format: uri-reference
    additionalProperties: true

  links:
    type: array
    items:
      type: object
      required: [rel, href]
      properties:
        rel:
          type: string
        href:
          type: string
          format: uri-reference
        type:
          type: string
        title:
          type: string
