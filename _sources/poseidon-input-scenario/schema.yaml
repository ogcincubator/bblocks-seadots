$schema: https://json-schema.org/draft/2020-12/schema
title: POSEIDON Scenario YAML Input
description: Main scenario document consumed by POSEIDON's YAML scenario loader.
type: object
properties:
  scenarioType:
    type: string
    description: Human-readable or implementation class name for the scenario factory.
  map:
    $ref: bblocks://ogc.hosted.seadots.poseidon-input-map
  biology:
    $ref: bblocks://ogc.hosted.seadots.poseidon-input-biology
  fleet:
    $ref: bblocks://ogc.hosted.seadots.poseidon-input-fleet
  portsAndMarkets:
    $ref: bblocks://ogc.hosted.seadots.poseidon-input-port-market
  regulations:
    $ref: bblocks://ogc.hosted.seadots.poseidon-input-regulation-policy
  output:
    $ref: bblocks://ogc.hosted.seadots.poseidon-input-observation-output
  plugins:
    type: array
    description: Optional POSEIDON startables, loggers, adaptors, or extensions.
    items:
      type: object
      additionalProperties: true
required:
  - map
  - biology
  - fleet
additionalProperties: true
