$schema: https://json-schema.org/draft/2020-12/schema
title: Reef Effect Utsira Execution
description: >
  SeaDOTs Catalog Execution profile for the concrete Utsira reef-effect
  biomass run. Extends the generic catalog execution record with a
  reefEffectRun object carrying the run-specific bindings, runtime details,
  model/equation references, and success criteria copied from the reusable
  reef-effect workflow example.

allOf:
  - $ref: https://ogcincubator.github.io/bblocks-seadots/build/annotated/hosted/seadots/catalog-execution/schema.json

$defs:
  Link:
    type: object
    required: [href]
    properties:
      href:
        type: string
        format: uri-reference
      rel:
        type: string
      type:
        type: string
      title:
        type: string

  Parameter:
    type: object
    required: [name]
    properties:
      name:
        type: string
      title:
        type: string
      description:
        type: string
      parameterSchema:
        type: object
        description: Inline JSON Schema fragment for the parameter value.
      vocabularyTerm:
        type: string
        format: uri-reference

  Binding:
    allOf:
      - $ref: '#/$defs/Link'
      - type: object
        properties:
          profileId:
            type: string
            description: Building block identifier of the referenced input or output profile.
          equationBinding:
            type: [string, "null"]
            description: Equation symbol bound by this record in the Utsira run.

properties:
  properties:
    type: object
    required: [reefEffectRun]
    properties:
      reefEffectRun:
        type: object
        required: [purpose, application, modelledBy, evidenceEquation, inputBindings, outputBindings, runtime]
        properties:
          purpose:
            type: string
          application:
            $ref: '#/$defs/Link'
          modelledBy:
            $ref: '#/$defs/Link'
          evidenceEquation:
            $ref: '#/$defs/Link'
          parameters:
            type: array
            items:
              $ref: '#/$defs/Parameter'
          inputBindings:
            type: array
            minItems: 1
            items:
              $ref: '#/$defs/Binding'
          outputBindings:
            type: array
            minItems: 1
            items:
              $ref: '#/$defs/Binding'
          runtime:
            type: object
            properties:
              language:
                type: string
              languageVersion:
                type: string
              dependencies:
                type: array
                items:
                  type: string
              entrypoint:
                type: string
              scheduling:
                type: string
              reproducibility:
                type: object
                properties:
                  seedPolicy:
                    type: string
                  provenance:
                    type: string
          successCriteria:
            type: array
            items:
              type: string
    additionalProperties: true
