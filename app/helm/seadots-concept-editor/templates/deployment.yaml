apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "editor.fullname" . }}
  labels:
    {{- include "editor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "editor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "editor.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: editor
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          env:
            - name: PORT
              value: {{ .Values.service.targetPort | quote }}
            # SPARQL config served to the browser via /config.js at runtime.
            - name: SPARQL_QUERY
              value: {{ .Values.sparql.query | quote }}
            - name: SPARQL_UPDATE
              value: {{ .Values.sparql.update | quote }}
            - name: SPARQL_GRAPH
              value: {{ .Values.sparql.graph | quote }}
            - name: FEATURE_PUBLISH
              value: {{ .Values.features.publish | quote }}
            - name: FEATURE_COMMIT
              value: {{ .Values.features.commit | quote }}
            - name: IMPORTED_NAMESPACES
              value: {{ join "," .Values.importedNamespaces | quote }}
            {{- if .Values.git.enabled }}
            - name: REPO_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            - name: GIT_REMOTE_URL
              value: {{ .Values.git.remoteUrl | quote }}
            - name: GIT_BRANCH
              value: {{ .Values.git.branch | quote }}
            - name: GIT_REMOTE
              value: {{ .Values.git.remote | quote }}
            - name: EDITS_PATH
              value: {{ .Values.git.editsPath | quote }}
            - name: GIT_AUTHOR_NAME
              value: {{ .Values.git.authorName | quote }}
            - name: GIT_AUTHOR_EMAIL
              value: {{ .Values.git.authorEmail | quote }}
            - name: GIT_PUSH
              value: {{ .Values.git.push | quote }}
            {{- if or .Values.git.token .Values.git.existingSecret }}
            - name: GIT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "editor.gitSecretName" . }}
                  key: {{ .Values.git.existingSecretKey | default "token" }}
            {{- end }}
            {{- end }}
            {{- with .Values.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: repo
              mountPath: {{ .Values.persistence.mountPath }}
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: repo
          persistentVolumeClaim:
            claimName: {{ include "editor.fullname" . }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
