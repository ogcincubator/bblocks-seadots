server:
  bind:
    host: 127.0.0.1
    port: 5001
  url: http://localhost:5001
  mimetype: application/json; charset=UTF-8
  encoding: utf-8
  language: en-US
  limit: 100
  max_limit: 10000
  map:
    url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
    attribution: © OpenStreetMap contributors
logging:
  level: ERROR
metadata:
  identification:
    title: 'Polish offshore wind: four sources, one model'
    description: Raw OSM, EMODnet, HubOcean ODP and national records next to their
      harmonised projection.
    keywords:
    - Baltic
    - offshore wind
    - linked data
    keywords_type: theme
    terms_of_service: https://creativecommons.org/licenses/by/4.0/
    url: https://github.com/ogcincubator/bblocks-seadots
  license:
    name: 'Mixed: see each collection (ODbL for OpenStreetMap-derived data)'
    url: https://www.openstreetmap.org/copyright
  provider:
    name: SeaDOTs
    url: https://www.sintef.no/projectweb/seadots/
  contact:
    name: SeaDOTs
    url: https://www.sintef.no/projectweb/seadots/
    role: pointOfContact
