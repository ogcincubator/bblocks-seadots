    - raw
    - national
    links:
    - type: text/html
      rel: canonical
      title: source
      href: https://www.gramwzielone.pl/?p=20373718
    extents: &id001
      spatial:
        bbox:
        - 14.0
        - 54.0
        - 19.0
        - 56.0
        crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
