$schema: https://json-schema.org/draft/2020-12/schema
title: POSEIDON Fleet and Fisher Input
description: Fleet and fisher-agent configuration consumed by POSEIDON.
type: object
properties:
  fishers:
    type: array
    minItems: 1
    items:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          x-jsonld-id: https://schema.org/name
        count:
          type: integer
          minimum: 1
        homePort:
          type: string
          x-jsonld-id: https://schema.org/homeLocation
        vessel:
          type: object
          additionalProperties: true
        gear:
          type: object
          required:
          - type
          properties:
            type:
              type: string
          additionalProperties: true
        departingStrategy:
          type: object
          additionalProperties: true
        destinationStrategy:
          type: object
          additionalProperties: true
        fishingStrategy:
          type: object
          additionalProperties: true
        gearStrategy:
          type: object
          additionalProperties: true
        discardingStrategy:
          type: object
          additionalProperties: true
        adaptation:
          type: object
          additionalProperties: true
        logbook:
          type: object
          additionalProperties: true
    x-jsonld-id: https://schema.org/agent
    x-jsonld-container: '@list'
  socialNetwork:
    type: object
    additionalProperties: true
additionalProperties: true
x-jsonld-vocab: https://w3id.org/iliad/seadots/poseidon/input#
x-jsonld-prefixes:
  schema: https://schema.org/
