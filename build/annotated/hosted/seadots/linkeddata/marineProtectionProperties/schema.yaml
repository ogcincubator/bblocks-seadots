    type:
    - integer
    - 'null'
    enum:
    - 0
    - 1
    - 2
    - 3
    - null
    x-jsonld-id: https://w3id.org/ogc/hosted/demo/marine-protections/dredgingDumping
  industrial_exploration:
    description: Exploration methods for finding minerals, oil, and gas, for example
