# A short, descriptive name of this building block collection
name: Seadots project

# Short abstract for this collection (optional)
abstract: |
  This is a collection of OGC Blocks for the [SeaDOTs project](http://seadots-project.eu).
  It defines the indicator model, property relationship schema, and supporting ontologies
  used across the three SeaDOTs Digital Twin demonstrators (Germany, Norway, Sweden).
  See also: [iliad-apis-features](https://github.com/ogcincubator/iliad-apis-features) for data types and DT processes.

# Description for this collection (optional)
#description: |
#  The description can be longer. Both **the abstract** *and the description* support Markdown,
#  including [links](https://google.es).

# Customize the following prefix (will be prepended to the path of the building blocks):
identifier-prefix: ogc.hosted.seadots.

# List of imports ("default" is an alias for the main OGC Building Blocks Register)
imports:
  - default
  - https://opengeospatial.github.io/ogcapi-sosa/
  - https://ogcincubator.github.io/geodcat-ogcapi-records/
  - https://ogcincubator.github.io/cross-domain-model/
  - https://ogcincubator.github.io/bblocks-sta/
  - https://ogcincubator.github.io/bblocks-stac/
  - https://ogcincubator.github.io/bblocks-openscience/
  - https://ogcincubator.github.io/iliad-apis-features/

# Whether to enable the (highly experimental) downcompiling of JSON schemas to an OpenAPI 3.0-compatible
# version
schema-oas30-downcompile: False

# SPARQL configuration (optional)
#   Authentication can be set through the sparql_username and sparql_password GitHub Workflow inputs
#   (see .github/workflow/process-bblocks.yml)
#
sparql:
   push: http://defs-hosted.opengis.net/fuseki-hosted/data           # SPARQL Graph Store Protocol endpoint for uploading data
   graph: https://w3id.org/ogc/hosted/seadots  # SPARQL Graph where data will be uploaded
   #                                           #  if left empty, the base URL for the publication will be used
   query: http://defs-hosted.opengis.net/fuseki-hosted/query       # SPARQL query endpoint where data will be available
   resources:                              # Additional resources to upload apart from building block metadata
      ontologies: true                     #   Whether to upload ontology files to the triplestore
